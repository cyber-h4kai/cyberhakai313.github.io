<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAKAI 313 INITIATIVE | Cyber Hakai 313</title>
    <style>
        :root {
            --bg-deep: #030408;
            --bg-card: #080a10;
            --neon-green: #00ff88;
            --neon-gold: #ffd700;
            --neon-cyan: #00f3ff;
            --text-main: #f0f4f8;
            --text-muted: #8c96a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            overflow-x: hidden; 
            min-height: 100vh;
            position: relative;
        }

        /* CRT Scanlines & Screen Flicker Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Ambient Lightning Flash Overlay */
        @keyframes ambientFlash {
            0%, 88%, 92%, 96%, 100% { opacity: 0; }
            90%, 94% { opacity: 0.12; background: var(--neon-cyan); }
        }
        .lightning-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -2;
            animation: ambientFlash 6s infinite;
        }

        #matrix-canvas, #lightning-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; pointer-events: none; 
        }
        #matrix-canvas { opacity: 0.12; }
        #lightning-canvas { opacity: 0.35; }

        /* Neon & Gold Glow Animations */
        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 8px var(--neon-green), 0 0 20px var(--neon-green), 0 0 40px var(--neon-green);
                opacity: 1;
            }
            20%, 24%, 55% { text-shadow: none; opacity: 0.75; }
        }

        @keyframes goldFlicker {
            0%, 100% { text-shadow: 0 0 10px var(--neon-gold), 0 0 25px var(--neon-gold); }
            50% { text-shadow: 0 0 3px var(--neon-gold), 0 0 8px var(--neon-gold); }
        }

        header { 
            border-bottom: 2px solid var(--neon-green); 
            background: rgba(3, 4, 8, 0.9); 
            position: sticky; top: 0; z-index: 100; 
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .nav-container { 
            max-width: 1200px; margin: 0 auto; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1rem 1.5rem; flex-wrap: wrap; gap: 1rem; 
        }

        .brand-wrapper { display: flex; align-items: center; gap: 12px; }
        .crescent-badge {
            width: 38px; height: 38px; border: 1px solid var(--neon-green); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            color: var(--neon-green); box-shadow: 0 0 12px rgba(0,255,136,0.3); background: rgba(0,255,136,0.05);
        }

        .logo-text h2 { font-size: 1.2rem; color: var(--neon-green); animation: neonFlicker 3s infinite alternate; letter-spacing: 1px; }
        .logo-text p { font-size: 0.7rem; color: var(--neon-gold); letter-spacing: 0.5px; }

        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .sfx-btn { 
            background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); 
            padding: 6px 14px; cursor: pointer; font-size: 0.8rem; transition: 0.3s; 
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.2); border-radius: 4px;
        }
        .sfx-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green); }

        .hero { max-width: 900px; margin: 2.5rem auto 2rem auto; padding: 0 1.5rem; text-align: center; }
        
        /* Small, mobile-friendly Bismillah calligraphy */
        .bismillah { 
            font-size: 1.6rem; 
            color: var(--neon-gold); 
            margin-bottom: 0.3rem; 
            animation: goldFlicker 2.5s infinite; 
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .swt-text { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.5rem; letter-spacing: 1.5px; text-transform: uppercase; }
        
        .pill-badge {
            display: inline-flex; align-items: center; gap: 8px;
            border: 1px solid rgba(0, 255, 136, 0.5); padding: 8px 18px; border-radius: 30px;
            color: var(--neon-green); font-size: 0.8rem; margin-bottom: 1.8rem;
            background: rgba(0, 255, 136, 0.05); box-shadow: 0 0 15px rgba(0,255,136,0.15);
        }

        .hero h1 { font-size: 2.2rem; margin-bottom: 0.4rem; color: var(--neon-green); animation: neonFlicker 3s infinite alternate; }
        .lead-sub { color: var(--neon-gold); font-size: 0.95rem; margin-bottom: 1.5rem; letter-spacing: 1px; font-weight: bold; }

        .container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem 4rem 1.5rem; }
        
        .section-box { 
            background: var(--bg-card); 
            border: 1px solid rgba(0, 255, 136, 0.35); 
            padding: 1.8rem; margin-bottom: 2rem; border-radius: 8px; 
            box-shadow: 0 0 25px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,255,136,0.03);
            transition: 0.3s;
        }
        .section-box:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
        }
        .section-box h2 { color: var(--neon-gold); margin-bottom: 1rem; font-size: 1.2rem; border-bottom: 1px dashed rgba(255,215,0,0.3); padding-bottom: 0.5rem; }
        .section-box p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 1rem; }
        .section-box p:last-child { margin-bottom: 0; }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.2rem;
            margin-top: 1rem;
        }
        .card {
            background: rgba(3, 4, 8, 0.7);
            border: 1px solid rgba(0, 255, 136, 0.25);
            padding: 1.2rem;
            border-radius: 6px;
        }
        .card h3 { color: var(--neon-green); font-size: 1rem; margin-bottom: 0.5rem; }
        .card p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin: 0; }

        /* Terminal Window */
        .terminal { background: #010204; border: 1px solid var(--neon-green); padding: 1rem; border-radius: 6px; height: 240px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; box-shadow: inset 0 0 20px rgba(0,255,136,0.15); }
        .terminal-output { margin-bottom: 1rem; color: var(--neon-green); }
        .terminal-input-line { display: flex; gap: 0.5rem; align-items: center; margin-top: 10px; }
        .terminal-input-line span { color: var(--neon-cyan); }
        .terminal-input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-family: monospace; font-size: 0.85rem; }

        footer { text-align: center; padding: 2rem; border-top: 1px solid rgba(0, 255, 136, 0.2); color: var(--text-muted); font-size: 0.8rem; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
            .bismillah { font-size: 1.3rem; }
            .pill-badge { font-size: 0.75rem; padding: 6px 14px; }
        }
    </style>
</head>

    <canvas id="lightning-canvas"></canvas>
